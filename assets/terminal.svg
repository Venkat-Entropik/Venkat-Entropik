    <stop offset="0" stop-color="#0a0e17"/>
    <stop offset="1" stop-color="#070b13"/>
  </linearGradient>
  <linearGradient id="tbd" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%"   stop-color="#22d3ee"   stop-opacity="0.9"/>
    <stop offset="50%"  stop-color="#a855f7" stop-opacity="0.7"/>
    <stop offset="100%" stop-color="#f472b6"   stop-opacity="0.9"/>
  </linearGradient>
</defs>

<!-- Window frame -->
<rect x="1" y="1" width="998" height="582" rx="18"

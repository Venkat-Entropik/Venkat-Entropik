<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="100" viewBox="0 0 1200 100">
<defs>
  <linearGradient id="stbg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0a0e17"/>
    <stop offset="1" stop-color="#070b13"/>
  </linearGradient>
  <linearGradient id="stbd" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0"   stop-color="#22d3ee"   stop-opacity="0.65"/>
    <stop offset="0.5" stop-color="#a855f7" stop-opacity="0.45"/>
    <stop offset="1"   stop-color="#f472b6"   stop-opacity="0.65"/>
  </linearGradient>
</defs>
<rect width="1200" height="100" rx="18"
  fill="url(#stbg)" stroke="url(#stbd)" stroke-width="1.5"/>

<text x="120" y="52" text-anchor="middle"
  font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="30" fill="#22d3ee"
  opacity="0">
  <animate attributeName="opacity" from="0" to="1"
    dur="0.6s" begin="0.0s" fill="freeze"/>
  <animateTransform attributeName="transform" type="translate"
    from="0 10" to="0 0" dur="0.6s" begin="0.0s" fill="freeze"
    calcMode="spline" keySplines="0.4 0 0.2 1"/>
  3+
</text>
<text x="120" y="76" text-anchor="middle"
  font-family="'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace" font-size="11.5" fill="#475569" letter-spacing="0.8">
  YEARS EXPERIENCE
</text>
<line x1="240" y1="18" x2="240" y2="82" stroke="#1e2d3d" stroke-width="1" opacity="0.7"/>
<text x="360" y="52" text-anchor="middle"
  font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="30" fill="#4ade80"
  opacity="0">
  <animate attributeName="opacity" from="0" to="1"
    dur="0.6s" begin="0.1s" fill="freeze"/>
  <animateTransform attributeName="transform" type="translate"
    from="0 10" to="0 0" dur="0.6s" begin="0.1s" fill="freeze"
    calcMode="spline" keySplines="0.4 0 0.2 1"/>
  6
</text>
<text x="360" y="76" text-anchor="middle"
  font-family="'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace" font-size="11.5" fill="#475569" letter-spacing="0.8">
  OSS PRS MERGED
</text>
<line x1="480" y1="18" x2="480" y2="82" stroke="#1e2d3d" stroke-width="1" opacity="0.7"/>
<text x="600" y="52" text-anchor="middle"
  font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="30" fill="#f472b6"
  opacity="0">
  <animate attributeName="opacity" from="0" to="1"
    dur="0.6s" begin="0.2s" fill="freeze"/>
  <animateTransform attributeName="transform" type="translate"
    from="0 10" to="0 0" dur="0.6s" begin="0.2s" fill="freeze"
    calcMode="spline" keySplines="0.4 0 0.2 1"/>
  100%
</text>
<text x="600" y="76" text-anchor="middle"
  font-family="'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace" font-size="11.5" fill="#475569" letter-spacing="0.8">
  TYPESCRIPT ADVOCATE
</text>
<line x1="720" y1="18" x2="720" y2="82" stroke="#1e2d3d" stroke-width="1" opacity="0.7"/>
<text x="840" y="52" text-anchor="middle"
  font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="30" fill="#fbbf24"
  opacity="0">
  <animate attributeName="opacity" from="0" to="1"
    dur="0.6s" begin="0.3s" fill="freeze"/>
  <animateTransform attributeName="transform" type="translate"
    from="0 10" to="0 0" dur="0.6s" begin="0.3s" fill="freeze"
    calcMode="spline" keySplines="0.4 0 0.2 1"/>
  ∞
</text>
<text x="840" y="76" text-anchor="middle"
  font-family="'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace" font-size="11.5" fill="#475569" letter-spacing="0.8">
  COFFEE CONSUMED
</text>
<line x1="960" y1="18" x2="960" y2="82" stroke="#1e2d3d" stroke-width="1" opacity="0.7"/>
<text x="1080" y="52" text-anchor="middle"
  font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="30" fill="#a855f7"
  opacity="0">
  <animate attributeName="opacity" from="0" to="1"
    dur="0.6s" begin="0.4s" fill="freeze"/>
  <animateTransform attributeName="transform" type="translate"
    from="0 10" to="0 0" dur="0.6s" begin="0.4s" fill="freeze"
    calcMode="spline" keySplines="0.4 0 0.2 1"/>
  1
</text>
<text x="1080" y="76" text-anchor="middle"
  font-family="'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace" font-size="11.5" fill="#475569" letter-spacing="0.8">
  GOAL: SHIP FAST
</text>

</svg>
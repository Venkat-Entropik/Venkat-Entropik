<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150">
<style>
 .t{font-family:'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif;font-weight:800;}
 .main{opacity:0;animation:rise 1.2s cubic-bezier(.2,.8,.2,1) .2s forwards}
 .g1{animation:gl1 5s steps(1) infinite 2s;opacity:0}
 .g2{animation:gl2 5s steps(1) infinite 2s;opacity:0}
 .sub{opacity:0;animation:fade 1s ease 1.1s forwards}
 @keyframes rise{from{opacity:0;transform:translateY(30px);letter-spacing:18px}to{opacity:1;transform:translateY(0);letter-spacing:4px}}
 @keyframes fade{to{opacity:1}}
 @keyframes gl1{0%{opacity:0}92%{opacity:.8;transform:translate(-5px,2px)}94%{opacity:.8;transform:translate(4px,-2px)}96%{opacity:0}}
 @keyframes gl2{0%{opacity:0}92%{opacity:.8;transform:translate(5px,-2px)}94%{opacity:.8;transform:translate(-4px,2px)}96%{opacity:0}}
</style>
<defs>
 <clipPath id="r"><rect width="1200" height="150" rx="22"/></clipPath>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070b14"/><stop offset="1" stop-color="#150a26"/></linearGradient>
 <linearGradient id="tx" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect">
  <stop offset="0" stop-color="#22d3ee"/><stop offset=".5" stop-color="#a855f7"/><stop offset="1" stop-color="#f472b6"/>
  <animateTransform attributeName="gradientTransform" type="translate" values="0 0;1 0;0 0" dur="6s" repeatCount="indefinite"/>
 </linearGradient>
 <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#7c3aed" stroke-opacity=".18"/></pattern>
 <linearGradient id="fadeG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity=".9"/></linearGradient>
 <mask id="m"><rect width="1200" height="150" fill="url(#fadeG)"/></mask>
 <filter id="blur"><feGaussianBlur stdDeviation="40"/></filter>
 <filter id="glow" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<g clip-path="url(#r)">
 <rect width="1200" height="150" fill="url(#bg)"/>
 <g mask="url(#m)"><rect x="0" y="-44" width="1200" height="238" fill="url(#grid)">
  <animateTransform attributeName="transform" type="translate" values="0 0;0 44" dur="2.5s" repeatCount="indefinite"/></rect></g>
 <g filter="url(#blur)" opacity=".55">
  <circle r="68" fill="#7c3aed"><animate attributeName="cx" values="180.0;420.0;180.0" dur="12s" repeatCount="indefinite"/><animate attributeName="cy" values="45.0;120.0;45.0" dur="10s" repeatCount="indefinite"/></circle>
  <circle r="60" fill="#0891b2"><animate attributeName="cx" values="1020.0;720.0;1020.0" dur="14s" repeatCount="indefinite"/><animate attributeName="cy" values="105.0;30.0;105.0" dur="11s" repeatCount="indefinite"/></circle>
  <circle r="45" fill="#db2777"><animate attributeName="cx" values="600.0;840.0;480.0;600.0" dur="16s" repeatCount="indefinite"/><animate attributeName="cy" values="135.0;75.0;135.0" dur="13s" repeatCount="indefinite"/></circle>
 </g>
 <rect width="1200" height="2" fill="#22d3ee" opacity=".25"><animate attributeName="y" values="0;150" dur="4s" repeatCount="indefinite"/></rect>
 <g class="t" text-anchor="middle" font-size="40">
  <text class="g1" x="600.0" y="88" fill="#22d3ee" letter-spacing="4">Let&#x27;s build something fast &amp; beautiful</text>
  <text class="g2" x="600.0" y="88" fill="#f472b6" letter-spacing="4">Let&#x27;s build something fast &amp; beautiful</text>
  <g class="main"><text x="600.0" y="88" fill="url(#tx)" filter="url(#glow)" letter-spacing="4">Let&#x27;s build something fast &amp; beautiful</text></g>
 </g>
 <rect width="1200" height="150" rx="22" fill="none" stroke="url(#tx)" stroke-opacity=".6" stroke-width="2"/>
</g></svg>
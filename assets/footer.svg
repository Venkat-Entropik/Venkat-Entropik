<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="120" viewBox="0 0 1200 120">
<defs>
  <linearGradient id="fbg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#020408"/>
    <stop offset="1" stop-color="#060a12"/>
  </linearGradient>
  <linearGradient id="ftext" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%"   stop-color="#22d3ee">
      <animate attributeName="stop-color" values="#22d3ee;#a855f7;#f472b6;#22d3ee" dur="4s" repeatCount="indefinite"/>
    </stop>
    <stop offset="100%" stop-color="#f472b6">
      <animate attributeName="stop-color" values="#f472b6;#22d3ee;#a855f7;#f472b6" dur="4s" repeatCount="indefinite"/>
    </stop>
  </linearGradient>
  <filter id="fglow" x="-20%" y="-60%" width="140%" height="220%">
    <feGaussianBlur stdDeviation="7" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <linearGradient id="fborder" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0"   stop-color="#22d3ee"   stop-opacity="0.7"/>
    <stop offset="0.5" stop-color="#a855f7" stop-opacity="0.5"/>
    <stop offset="1"   stop-color="#f472b6"   stop-opacity="0.7"/>
    <animate attributeName="x1" values="0;1;0" dur="5s" repeatCount="indefinite"/>
  </linearGradient>
  <clipPath id="fclip"><rect width="1200" height="120" rx="18"/></clipPath>
</defs>

<g clip-path="url(#fclip)">
  <rect width="1200" height="120" fill="url(#fbg)"/>
  <ellipse cx="600" cy="60" rx="360" ry="65"
    fill="#a855f7" opacity="0.06" filter="url(#fglow)"/>

  <text x="600" y="58" text-anchor="middle"
    font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="38"
    fill="url(#ftext)" filter="url(#fglow)" letter-spacing="2">
    Let's build something fast &amp; beautiful
  </text>
  <text x="600" y="90" text-anchor="middle"
    font-family="'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace" font-size="13.5" fill="#475569" letter-spacing="2">
    venkat@github  ·  react &amp; typescript specialist  ·  open to collaborations
  </text>

  <rect width="1200" height="120" rx="18"
    fill="none" stroke="url(#fborder)" stroke-width="1.5"/>
</g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320">
<defs>
  <linearGradient id="rbg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0a0e17"/>
    <stop offset="1" stop-color="#070b13"/>
  </linearGradient>
  <linearGradient id="rpoly" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#22d3ee"   stop-opacity="0.3"/>
    <stop offset="1" stop-color="#a855f7" stop-opacity="0.2"/>
  </linearGradient>
  <linearGradient id="rpborder" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#22d3ee"   stop-opacity="0.8"/>
    <stop offset="1" stop-color="#a855f7" stop-opacity="0.6"/>
  </linearGradient>
  <filter id="rglow" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <linearGradient id="sborder" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0"   stop-color="#22d3ee"   stop-opacity="0.7"/>
    <stop offset="0.5" stop-color="#a855f7" stop-opacity="0.5"/>
    <stop offset="1"   stop-color="#f472b6"   stop-opacity="0.7"/>
  </linearGradient>
</defs>

<rect width="1200" height="320" rx="18"
  fill="url(#rbg)" stroke="url(#sborder)" stroke-width="1.5"/>

<!-- Section header -->
<text x="32" y="36" font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="800" fill="#f1f5f9">⚡ Skills &amp; Expertise</text>

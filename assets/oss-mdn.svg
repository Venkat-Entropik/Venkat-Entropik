<svg xmlns="http://www.w3.org/2000/svg" width="390" height="220" viewBox="0 0 390 220">
<defs>
  <radialGradient id="cg" cx="0.85" cy="0.1" r="0.8">
    <stop offset="0" stop-color="#22d3ee" stop-opacity="0.2"/>
    <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="cbg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0c1220"/>
    <stop offset="1" stop-color="#08101c"/>
  </linearGradient>
  <filter id="cglow" x="-10%" y="-20%" width="120%" height="140%">
    <feGaussianBlur stdDeviation="3" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>

<rect x="2" y="2" width="386" height="216" rx="18"
  fill="url(#cbg)" stroke="#1e2d3d" stroke-width="1.5"/>
<rect x="2" y="2" width="386" height="216" rx="18" fill="url(#cg)"/>

<!-- Animated dashed border -->
<rect x="3" y="3" width="384" height="214" rx="17" fill="none"
  stroke="#22d3ee" stroke-width="2.5" stroke-linecap="round" opacity="0.85"
  stroke-dasharray="100 1096">
  <animate attributeName="stroke-dashoffset" from="0" to="-1196"
    dur="5s" repeatCount="indefinite"/>
</rect>

<!-- Ghost border -->
<rect x="3" y="3" width="384" height="214" rx="17" fill="none"
  stroke="#22d3ee" stroke-width="0.5" opacity="0.12"/>

<!-- Logo badge -->
<circle cx="34" cy="43" r="16" fill="#22d3ee" opacity="0.12"/>
<circle cx="34" cy="43" r="11" fill="#22d3ee" opacity="0.2">
  <animate attributeName="r"       values="10;14;10" dur="3s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values="0.2;0.07;0.2" dur="3s" repeatCount="indefinite"/>
</circle>
<text x="34" y="49" text-anchor="middle"
  font-family="'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace" font-size="11" font-weight="800"
  fill="#22d3ee" filter="url(#cglow)">MDN</text>

<!-- Name -->
<text x="60" y="38" font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="20"
  font-weight="800" fill="#f1f5f9">MDN Web Docs</text>

<!-- PR count pill -->
<rect x="60" y="46" width="136" height="22" rx="11"
  fill="#22d3ee" opacity="0.1" stroke="#22d3ee" stroke-width="0.8" stroke-opacity="0.5"/>
<text x="70" y="61" font-family="'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace" font-size="12"
  fill="#22d3ee" letter-spacing="0.8">2 PULL REQUESTS MERGED</text>

<text x="22" y="106" font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" fill="#cbd5e1"><tspan fill="#22d3ee" font-size="12">▸ </tspan>Fixed Django documentation</text><text x="22" y="132" font-family="'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" fill="#cbd5e1"><tspan fill="#22d3ee" font-size="12">▸ </tspan>Improved content clarity</text>
</svg>